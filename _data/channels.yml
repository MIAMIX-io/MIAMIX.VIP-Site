# Homepage channel rows ("streaming service" shelves).
#
# Each row is built automatically from posts whose Notion `channel` matches one
# of the names in `channels`. To merge thin channels, list several; to retire a
# row, delete it or set `show: false`. Rows with no posts hide themselves.
#
# Row colors: rows alternate deep black / stone grey in /assets/css/home.css.
# Brand pink is the only accent, so every `accent` below is the same pink.
# (home.css forces pink anyway; the value is kept so row.html always has one.)
#
# Fields
#   id        anchor id for the row (also used for CSS)
#   eyebrow   small label above the title
#   title     the big editorial title
#   tagline   short paragraph under the title (about two sentences)
#   accent    brand pink (leave as is)
#   channels  Notion channel names feeding this row
#   url       "See all" destination
#   banner    optional image path for the row backdrop (defaults to newest post)

labels:
  Sports: "Sports & Entertainment"
  Fashion: "Fashion & Lifestyle"
  Health: "Health & Wellness"
  Culture: "Culture & Art"
  Travel: "Travel & Leisure"
  Hospitality: "Hospitality"
  Nonprofit: "Nonprofit"
  CuratedLifestyle: "Curated Lifestyle"
  InterMIA: "Inter Miami"

rows:
  - id: game-day
    eyebrow: "Sports & Entertainment"
    title: "Game Day, Miami Style"
    tagline: "From Inter Miami nights to race weekends and fight cards, the games, athletes and moments that bring Miami to its feet. Front-row access to the energy that makes this city a sports capital."
    accent: "#d9008d"
    channels: [Sports]
    url: /sports

  - id: departures
    eyebrow: "Travel & Leisure"
    title: "Departures"
    tagline: "Miami is the gateway to everywhere. Airlines, cruises, resorts and weekend escapes, curated for travelers who care how the journey feels as much as where it ends."
    accent: "#d9008d"
    channels: [Travel]
    url: /travel

  - id: table-for-miami
    eyebrow: "Hospitality"
    title: "Table for Miami"
    tagline: "The restaurants, bars and hotels that define Miami hospitality, and the people who run them. Where to eat well, stay in style and be part of the room."
    accent: "#d9008d"
    channels: [Hospitality]
    url: /hospitality

  - id: made-in-miami
    eyebrow: "Culture & Art"
    title: "Made in Miami"
    tagline: "Galleries, stages, studios and street corners. Meet the artists, makers and venues shaping Miami's creative identity, and the stories behind the work."
    accent: "#d9008d"
    channels: [Culture]
    url: /culture

  - id: style-edit
    eyebrow: "Fashion & Lifestyle"
    title: "The Style Edit"
    tagline: "Designers, boutiques and stylists setting the tone from Brickell to the Beach. The looks, the labels and the craft behind how Miami dresses."
    accent: "#d9008d"
    channels: [Fashion]
    url: /fashion

  - id: curated
    eyebrow: "Curated Lifestyle"
    title: "Curated by Romina"
    tagline: "Luxury with soul, handpicked by MIAMIX partner Romina Nabhen. A personal edit of experiences, brands and places chosen for quality, character and taste."
    accent: "#d9008d"
    channels: [CuratedLifestyle]
    url: /curated-lifestyle

  - id: feel-good
    eyebrow: "Health, Wellness & Nonprofit"
    title: "Feel Good, Do Good"
    tagline: "Wellness practices, health pioneers and the nonprofits strengthening our community. Stories about feeling better, and about the people and foundations helping others do the same."
    accent: "#d9008d"
    channels: [Health, Nonprofit]
    url: /health
