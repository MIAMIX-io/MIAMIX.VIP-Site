<div class="brand-logos">
{%- for partner in site.data.partners -%}
  {%- if partner.url -%}
  <a class="partner-tile {% if partner.light %}partner-tile--light{% endif %}" href="{{ partner.url }}" target="_blank" rel="noopener" aria-label="{{ partner.name }} - opens in new tab">
    <img src="{{ partner.image }}" alt="{{ partner.name }}" loading="lazy">
  </a>
  {%- else -%}
  <span class="partner-tile {% if partner.light %}partner-tile--light{% endif %}">
    <img src="{{ partner.image }}" alt="{{ partner.name }}" loading="lazy">
  </span>
  {%- endif -%}
{%- endfor -%}
</div>
