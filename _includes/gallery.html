{%- assign cols = include.cols | default: 3 -%}
{%- assign imgs = include.images | split: '|' -%}
{%- assign folder = include.folder | default: '/images/curated' -%}
<div class="gallery image-gallery" data-cols="{{ cols }}">
  {%- for img in imgs -%}
    {%- assign name = img | strip -%}
    {%- if name != '' -%}
      <img src="{{ folder }}/{{ name | relative_url }}" alt="" loading="lazy" decoding="async">
    {%- endif -%}
  {%- endfor -%}
</div>
